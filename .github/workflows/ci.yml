name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # A production Next.js build of the web demo, against the package that was just built.
      - run: pnpm --filter @steady-socket/demo-web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      # The demo server's container image still builds (Node 22 only; the image brings its own Node).
      - run: docker build -f apps/demo-server/Dockerfile -t steady-socket-demo-server .
        if: matrix.node == 22
      - run: pnpm check:package
      # size-limit itself needs Node 22 (fs.glob), and bundle size does not depend on the Node version.
      - run: pnpm size
        if: matrix.node == 22
