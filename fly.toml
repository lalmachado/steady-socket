# Fly.io config for the demo server (apps/demo-server). Run flyctl from the repository root: the
# Docker build context is the directory this file is in, and the Dockerfile needs the whole
# workspace. See DEPLOYING.md.

# Change this if the name is taken (names are global across Fly).
app = "steady-socket-demo"

[build]
  dockerfile = "apps/demo-server/Dockerfile"

[http_service]
  # The image listens on 8787 (PORT in the Dockerfile). WebSockets go through the same service.
  internal_port = 8787
  force_https = true
  # Sessions and tokens live in this process's memory, so the app must run as ONE machine, and a
  # stopped machine forgets everyone. Set "stop" instead of "off" to save money when it is idle,
  # at the price of a few seconds' cold start for the next visitor.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/state"

# 180 open connections measured about 52 MB, so 256 MB has plenty of room.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
